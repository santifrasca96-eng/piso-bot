    source: habitaclia
    kind: room
    url: "https://www.habitaclia.com/alquiler-habitacion-barcelona.htm"           # sin verificar
    zones: *barrios_bcn
  - {name: "Habitaciones Badalona (Milanuncios)",     source: milanuncios, kind: room, url: "https://www.milanuncios.com/alquiler-de-habitaciones-en-badalona-barcelona/"}
  - {name: "Habitaciones L'Hospitalet (Milanuncios)", source: milanuncios, kind: room, url: "https://www.milanuncios.com/alquiler-de-habitaciones-en-hospitalet-de-llobregat-barcelona/"}
