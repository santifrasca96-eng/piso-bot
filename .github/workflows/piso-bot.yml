name: piso-bot

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué ejecutar"
        type: choice
        default: tick
        options: [tick, check-urls, dry-run]

concurrency:
  group: piso-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
      MODE: ${{ github.event.inputs.mode || 'tick' }}
    steps:
      - uses: actions/checkout@v4

      - name: Localizar el proyecto
        id: loc
        run: |
          MAIN=$(find . -path '*/piso_bot/__main__.py' -print -quit)
          if [ -z "$MAIN" ]; then
            echo "No encuentro piso_bot/__main__.py. Estos son los archivos del repositorio:"
            find . -path ./.git -prune -o -type f -print | head -60
            exit 1
          fi
          DIR=$(dirname "$(dirname "$MAIN")")
          echo "Proyecto en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: ${{ steps.loc.outputs.dir }}
        run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.loc.outputs.dir }}/data
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - name: Ejecutar
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          case "$MODE" in
            check-urls) python -m piso_bot check-urls ;;
            dry-run)    python -m piso_bot once --dry ;;
            *)          python -m piso_bot tick ;;
          esac

      - uses: actions/cache/save@v4
        if: always() && steps.loc.outputs.dir != ''
        with:
          path: ${{ steps.loc.outputs.dir }}/data
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
