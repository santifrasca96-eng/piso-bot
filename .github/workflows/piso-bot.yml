name: piso-bot

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué ejecutar"
        type: choice
        default: tick
        options: [tick, check-urls, dry-run]

concurrency:
  group: piso-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: piso-bot
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
      MODE: ${{ github.event.inputs.mode || 'tick' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: piso-bot/requirements.txt

      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: piso-bot/data
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - name: Ejecutar
        run: |
          case "$MODE" in
            check-urls) python -m piso_bot check-urls ;;
            dry-run)    python -m piso_bot once --dry ;;
            *)          python -m piso_bot tick ;;
          esac

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: piso-bot/data
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
